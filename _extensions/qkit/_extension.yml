title: qkit
author: Gabriel Cabrera Guzmán
version: 0.1.0
contributes:
  formats:
    beamer:
      include-in-header:
        - beamer/preamble.tex
      template-partials:
        - beamer/title.tex
      pdf-engine: xelatex
      navigation: horizontal
      theme: default
      colortheme: default
      aspectratio: 43
      keep-tex: true
    pdf:
      include-in-header:
        - cv/preamble.tex
      template-partials:
        # doc-class.tex is required: Quarto's default loads unicode-math (and
        # so fontspec) before $fontfamily$, which breaks mathpazo's NFSS bold
        # and italic lookup under lualatex. This one loads the font package
        # first, then fontspec, and before microtype.
        - cv/doc-class.tex
        - cv/before-body.tex
        - cv/after-body.tex
      filters:
        - cv/filter.lua
      pdf-engine: lualatex
      geometry:
        - margin=0.70in
      fontfamily: mathpazo
      fontfamilyoptions:
        - sc
        - osf
      fontsize: 10pt
      linkcolor: blue
      urlcolor: blue
      keep-tex: true
